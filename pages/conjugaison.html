<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<nav class="topbar">
  <a href="../index.html" class="topbar-logo">Français <span>pour Laura</span></a>
  <div style="display:flex;align-items:center;">
    <div class="topbar-nav">
      <a href="vocabulaire.html" data-es="Vocabulario" data-ca="Vocabulari">Vocabulario</a>
      <a href="conjugaison.html" class="active" data-es="Conjugación" data-ca="Conjugació">Conjugación</a>

    </div>

</nav>
<div class="nav-mobile">
  <a href="vocabulaire.html"><span class="icon">📚</span><span data-es="Vocab" data-ca="Vocab">Vocab</span></a>
  <a href="conjugaison.html" class="active"><span class="icon">✏️</span><span data-es="Verbos" data-ca="Verbs">Verbos</span></a>
  <a href="grammaire.html"><span class="icon">📐</span><span data-es="Gram." data-ca="Gram.">Gram.</span></a>
  <a href="prononciation.html"><span class="icon">🔊</span><span data-es="Pron." data-ca="Pron.">Pron.</span></a>

</div>

<div class="page-wrap">
<div class="container">
  <div class="page-header fade-up">
    <div class="page-header-label">✏️ <span data-es="Módulo 2" data-ca="Mòdul 2">Módulo 2</span></div>
    <h1 data-es="Conjugación" data-ca="Conjugació">Conjugación</h1>
    <p data-es="Los tiempos verbales del francés explicados desde el español. Con ejemplos del Quebec." data-ca="Els temps verbals del francès explicats des del castellà. Amb exemples del Quebec.">Los tiempos verbales del francés explicados desde el español. Con ejemplos del Quebec.</p>
  </div>

  <!-- TENSES REFERENCE -->
  <div id="tenses-ref"></div>

  <hr class="divider">

  <!-- EXERCISES -->
  <div class="section-label" data-es="EJERCICIOS" data-ca="EXERCICIS">EJERCICIOS</div>
  <div class="section-title" id="ex-title"></div>
  <div class="tabs" id="ex-tabs"></div>

  <div class="card fade-up" id="quiz-area">
    <div class="score-bar">
      <span class="score-pill">⭐ <span id="score">0</span> / <span id="total">0</span></span>
      <div class="progress-line"><div class="progress-line-fill" id="q-progress" style="width:0%"></div></div>
    </div>
    <div class="quiz-prompt" id="q-prompt"></div>
    <div class="options-grid" id="q-options"></div>
    <div class="feedback-box" id="q-feedback"></div>
    <div style="margin-top:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;" id="q-actions">
      <button class="btn btn-ghost" id="btn-next" style="display:none" onclick="nextQ()">
        <span data-es="Siguiente pregunta" data-ca="Pregunta següent">Siguiente pregunta</span> →
      </button>
    </div>
  </div>

  <div id="completion-area" style="display:none"></div>
</div>
</div>

<script src="../js/lang.js"></script>
<script>
let data = null, setIdx = 0, qIdx = 0, score = 0, answered = false;
const lang = () => localStorage.getItem('laura_lang') || 'es';

async function load() {
  const r = await fetch('../data/conjugaison.json');
  data = await r.json();
  renderTensesRef();
  renderExTabs();
  startSet(0);
}

function renderTensesRef() {
  const l = lang();
  const html = data.intro.explication_temps.map(t => `
    <div class="card fade-up" style="margin-bottom:0.75rem;">
      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;flex-wrap:wrap;">
        <span class="tag tag-maple">${t.temps_fr}</span>
        <span style="color:var(--text-dim);font-size:0.82rem;">≈ ${t['equiv_'+l]}</span>
      </div>
      <div class="info-box" style="margin-bottom:0.6rem;">${t.usage[l]}</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--cream);margin-bottom:0.3rem;">🇫🇷 <em>${t.exemple_fr}</em></div>
      <div style="font-size:0.83rem;color:var(--text-dim);">🇪🇸 ${t['exemple_'+l]}</div>
      ${t.piege ? `<div class="warning-box" style="margin-top:0.75rem;margin-bottom:0;">${t.piege[l]}</div>` : ''}
    </div>`).join('');
  document.getElementById('tenses-ref').innerHTML = `
    <div class="section-label" data-es="GUÍA DE TIEMPOS VERBALES" data-ca="GUIA DE TEMPS VERBALS">${l === 'es' ? 'GUÍA DE TIEMPOS VERBALES' : 'GUIA DE TEMPS VERBALS'}</div>
    <div class="section-title" style="margin-bottom:1rem">${l === 'es' ? 'Francés vs. Español' : 'Francès vs. Castellà'}</div>
    ${html}`;
}

function renderExTabs() {
  const l = lang();
  const el = document.getElementById('ex-tabs');
  el.innerHTML = '';
  data.exercices.forEach((ex, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === setIdx ? ' active' : '');
    b.textContent = ex.titre[l];
    b.onclick = () => startSet(i);
    el.appendChild(b);
  });
}

function startSet(i) {
  setIdx = i; qIdx = 0; score = 0; answered = false;
  document.getElementById('completion-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('ex-title').textContent = data.exercices[i].titre[lang()];
  renderExTabs();
  const ex = data.exercices[setIdx];
  const l = lang();
  const ctx = ex.contexte ? `<div class="info-box" style="margin-bottom:1rem">${ex.contexte[l]}</div>` : '';
  document.getElementById('quiz-area').insertAdjacentHTML('afterbegin', ctx);
  renderQuestion();
}

function renderQuestion() {
  const ex = data.exercices[setIdx];
  const l = lang();
  answered = false;
  if (qIdx >= ex.questions.length) { showCompletion(); return; }
  const q = ex.questions[qIdx];
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = qIdx;
  document.getElementById('q-progress').style.width = (qIdx / ex.questions.length * 100) + '%';
  const phrase = q.phrase.replace(/_+/, '<span class="blank">___</span>');
  document.getElementById('q-prompt').innerHTML = phrase;
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box'; fb.innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  const opts = [...q.options].sort(() => Math.random() - 0.5);
  document.getElementById('q-options').innerHTML = opts.map(o =>
    `<button class="option" onclick="checkAns('${o.replace(/'/g,"\\'")}', this)">${o}</button>`
  ).join('');
}

function checkAns(sel, btn) {
  if (answered) return;
  answered = true;
  const q = data.exercices[setIdx].questions[qIdx];
  const l = lang();
  document.querySelectorAll('.option').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.reponse) b.classList.add('correct');
  });
  const fb = document.getElementById('q-feedback');
  const correct = sel === q.reponse;
  if (correct) { score++; btn.classList.add('correct'); }
  else btn.classList.add('wrong');
  fb.className = 'feedback-box show ' + (correct ? 'correct' : 'wrong');
  fb.innerHTML = (correct ? '✅ ' : '❌ ') + (correct
    ? (l === 'es' ? '¡Correcto!' : 'Correcte!')
    : (l === 'es' ? `La respuesta correcta es: <strong>${q.reponse}</strong>` : `La resposta correcta és: <strong>${q.reponse}</strong>`))
    + `<div class="explication">${q.explication[l]}</div>`;
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = qIdx + 1;
  document.getElementById('btn-next').style.display = 'inline-flex';
  qIdx++;
}

function nextQ() { renderQuestion(); }

function showCompletion() {
  const l = lang();
  const total = data.exercices[setIdx].questions.length;
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('completion-area').style.display = 'block';
  document.getElementById('completion-area').innerHTML = `
    <div class="card completion">
      <div class="completion-icon">🎉</div>
      <h2>${l === 'es' ? '¡Bravo, Laura!' : 'Bravo, Laura!'}</h2>
      <p style="font-size:1.1rem;color:var(--gold);margin:0.5rem 0">${score} / ${total}</p>
      <p style="margin-top:0.5rem">${l === 'es' ? 'Has completado este ejercicio.' : 'Has completat aquest exercici.'}</p>
      <button class="btn btn-primary" style="margin-top:1.5rem" onclick="startSet(${setIdx})">
        ${l === 'es' ? '🔄 Repetir' : '🔄 Repetir'}
      </button>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => setTimeout(() => { renderTensesRef(); renderExTabs(); }, 0));
  });
});
</script>
</body>
</html>
