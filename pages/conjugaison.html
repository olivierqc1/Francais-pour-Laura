<style>
.select-nav { width:100%; padding:0.8rem 1rem; background:var(--bg3); border:1px solid var(--border); border-radius:10px; color:var(--cream); font-family:'Outfit',sans-serif; font-size:1rem; font-weight:500; }
.select-nav:focus { outline:none; border-color:var(--gold); }
.select-label { font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:0.4rem; display:block; }
.controls { display:grid; grid-template-columns:1fr; gap:1rem; margin-bottom:1.5rem; }
.niv-row { display:flex; gap:0.4rem; flex-wrap:wrap; }
.niv-chip { padding:0.4rem 0.85rem; border-radius:999px; border:1px solid var(--border); background:var(--bg2); color:var(--text-dim); cursor:pointer; font-size:0.82rem; font-weight:600; transition:all 0.18s; }
.niv-chip.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
.grp-title { font-family:'Cormorant Garamond',serif; font-size:1.3rem; color:var(--gold-light); margin:1.4rem 0 0.6rem; }
.verb-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:1.1rem 1.25rem; margin-bottom:0.9rem; }
.verb-head { display:flex; align-items:center; gap:0.55rem; flex-wrap:wrap; margin-bottom:0.8rem; padding-bottom:0.6rem; border-bottom:1px solid var(--border); }
.verb-inf { font-family:'Cormorant Garamond',serif; font-size:1.45rem; font-weight:700; color:var(--maple-light); }
.verb-trad { font-size:0.82rem; color:var(--text-dim); font-style:italic; }
.lvl-tag { padding:0.1rem 0.5rem; border-radius:4px; font-size:0.68rem; font-weight:700; letter-spacing:0.05em; margin-left:auto; }
.lvl-A1 { background:rgba(122,170,128,0.2); color:var(--sage); }
.lvl-A2 { background:rgba(201,153,58,0.18); color:var(--gold-light); }
.lvl-B1 { background:rgba(200,69,26,0.18); color:var(--maple-light); }
.conj-row { display:grid; grid-template-columns:5.5rem 1fr 2rem; gap:0.5rem; align-items:center; padding:0.42rem 0; border-bottom:1px solid var(--border); }
.conj-row:last-child { border-bottom:none; }
.conj-pron { color:var(--text-dim); font-size:0.85rem; }
.conj-forme { font-family:'Cormorant Garamond',serif; font-size:1.12rem; font-weight:600; color:var(--cream); }
.conj-play { width:1.9rem; height:1.9rem; border-radius:50%; border:1px solid var(--border); background:var(--bg3); color:var(--gold-light); cursor:pointer; font-size:0.85rem; display:flex; align-items:center; justify-content:center; justify-self:end; }
.conj-play:hover { background:var(--maple); color:white; }
.practice-toggle { display:flex; gap:0.5rem; margin:1.5rem 0 1rem; }
.practice-toggle .btn { flex:1; justify-content:center; }
.answer-input { width:100%; background:var(--bg3); border:2px solid var(--border); border-radius:10px; padding:0.85rem 1rem; color:var(--cream); font-family:'Cormorant Garamond',serif; font-size:1.35rem; text-align:center; transition:border 0.2s; }
.answer-input:focus { outline:none; border-color:var(--gold); }
.answer-input:disabled { opacity:0.85; }
</style>

<div class="page-wrap">

  <div class="page-header fade-up">
    <div class="page-header-label">✏️ <span data-es="Módulo 2" data-ca="Mòdul 2">Módulo 2</span></div>
    <h1 data-es="Conjugación" data-ca="Conjugació">Conjugación</h1>
    <p data-es="Elige un tiempo. Verás los 3 grupos con tabla y audio. En 'Practicar' escribes la respuesta (los acentos no son obligatorios)." data-ca="Tria un temps. Veuràs els 3 grups amb taula i àudio. A 'Practicar' escrius la resposta (els accents no són obligatoris).">Elige un tiempo. En 'Practicar' escribes la respuesta.</p>

    <div>
      <label class="select-label" id="select-label">ELIGE UN TIEMPO</label>
      <select class="select-nav" id="temps-select" onchange="loadTemps(this.value)"></select>

      <label class="select-label" id="niv-label">FILTRO POR NIVEL</label>

    <button class="btn btn-ghost" id="btn-practice" onclick="showPractice()">🎯 <span data-es="Practicar" data-ca="Practicar">Practicar</span></button>
  </div>

        <span class="score-pill">⭐ <span id="score">0</span> / <span id="total">0</span></span>

      </div>
      <div class="quiz-prompt" id="q-prompt"></div>
      <input class="answer-input" id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="...">
      <div class="feedback-box" id="q-feedback"></div>
      <div style="margin-top:1rem;display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-primary" id="btn-check" onclick="checkAns()"><span data-es="Comprobar" data-ca="Comprovar">Comprobar</span></button>
        <button class="btn btn-ghost" id="btn-next" style="display:none" onclick="nextQ()"><span data-es="Siguiente" data-ca="Següent">Siguiente</span> &rarr;</button>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/lang.js"></script>
<script>
let index=null, current=null, nivFilter='all', qIdx=0, score=0, answered=false, qList=[], voicesCache=[];
const ORDER={'A1':1,'A2':2,'B1':3};
const lang=()=>localStorage.getItem('laura_lang')||'es';

function loadVoices(){ voicesCache=window.speechSynthesis?speechSynthesis.getVoices():[]; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function say(t){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='fr-CA'; const v=voicesCache.find(x=>x.lang==='fr-CA')||voicesCache.find(x=>x.lang&&x.lang.startsWith('fr')); if(v)u.voice=v; u.rate=0.9; speechSynthesis.speak(u); }
function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function lvlOk(n){ return nivFilter==='all'||ORDER[n]<=ORDER[nivFilter]; }
// normalisation: minuscules, sans accents, sans espaces multiples
function norm(s){ return (s||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' '); }

async function init(){
  const r=await fetch('../data/conjugaison/index.json'); index=await r.json();
  buildSelect(); buildNiv(); loadTemps(0);
}
function buildSelect(){
  const l=lang(); const sel=document.getElementById('temps-select'); sel.innerHTML='';
  index.temps.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=t.nom[l]+'  ·  '+t.niveau; o.disabled=!lvlOk(t.niveau); sel.appendChild(o); });
  document.getElementById('select-label').textContent=l==='es'?'ELIGE UN TIEMPO':'TRIA UN TEMPS';
}
function buildNiv(){
  const l=lang(); const row=document.getElementById('niv-row'); row.innerHTML='';
  index.niveaux.forEach(n=>{ const b=document.createElement('button'); b.className='niv-chip'+(n.id===nivFilter?' active':''); b.textContent=n.nom[l]; b.onclick=()=>{ nivFilter=n.id; buildNiv(); buildSelect(); applyFilterReload(); }; row.appendChild(b); });
  document.getElementById('niv-label').textContent=l==='es'?'FILTRO POR NIVEL':'FILTRE PER NIVELL';
}
function applyFilterReload(){
  const ti=index.temps.findIndex(t=>t.id===current.id);
  if(!lvlOk(index.temps[ti].niveau)){ const first=index.temps.findIndex(t=>lvlOk(t.niveau)); if(first>=0){ loadTemps(first); return; } }
  renderRegle(); if(document.getElementById('practice-zone').style.display!=='none')showPractice(); else showTables();
}
async function loadTemps(i){
  const t=index.temps[Number(i)]; const r=await fetch('../'+t.fichier); current=await r.json();
  document.getElementById('temps-select').value=i; qIdx=0; score=0; answered=false;
  renderRegle(); showTables();
}
function renderRegle(){ const l=lang(); document.getElementById('regle-zone').innerHTML='<div class="section-label">'+current.nom[l]+'</div><div class="info-box">'+current.regle[l]+'</div>'; }

function showTables(){
  document.getElementById('btn-tables').className='btn btn-gold';
  document.getElementById('btn-practice').className='btn btn-ghost';
  document.getElementById('practice-zone').style.display='none';
  const tz=document.getElementById('tables-zone'); tz.style.display='block'; const l=lang(); let html='';
  current.groupes.forEach(g=>{
    const verbs=g.verbes.filter(v=>lvlOk(v.niveau)); if(!verbs.length)return;
    html+='<div class="grp-title">'+g.nom[l]+'</div>';
    html+=verbs.map(v=>{
      const rows=v.conjugaison.map(c=>'<div class="conj-row"><span class="conj-pron">'+c.pronom+'</span><span class="conj-forme">'+c.forme+'</span><button class="conj-play" onclick="say(\''+esc(c.tts)+'\')">🔊</button></div>').join('');
      return '<div class="verb-card fade-up"><div class="verb-head"><span class="verb-inf">'+v.infinitif+'</span><span class="verb-trad">'+v.trad[l]+'</span><span class="lvl-tag lvl-'+v.niveau+'">'+v.niveau+'</span></div>'+rows+'</div>';
    }).join('');
  });
  tz.innerHTML=html||'<div class="info-box">'+(l==='es'?'No hay verbos para este nivel.':'No hi ha verbs per a aquest nivell.')+'</div>';
}

function showPractice(){
  document.getElementById('btn-practice').className='btn btn-gold';
  document.getElementById('btn-tables').className='btn btn-ghost';
  document.getElementById('tables-zone').style.display='none';
  document.getElementById('practice-zone').style.display='block';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('completion-area').style.display='none';
  qList=current.exercices.filter(e=>lvlOk(e.niveau));
  qIdx=0; score=0; answered=false; renderQuestion();
}

function renderQuestion(){
  const l=lang(); answered=false;
  const inp=document.getElementById('answer');
  if(!qList.length){ document.getElementById('quiz-area').innerHTML='<div class="info-box">'+(l==='es'?'No hay ejercicios para este nivel.':'No hi ha exercicis per a aquest nivell.')+'</div>'; return; }
  if(qIdx>=qList.length){ showCompletion(); return; }
  const q=qList[qIdx];
  document.getElementById('score').textContent=score;
  document.getElementById('total').textContent=qIdx;
  document.getElementById('q-progress').style.width=(qIdx/qList.length*100)+'%';
  document.getElementById('q-prompt').innerHTML=q.phrase.replace(/_+/,'<span class="blank">______</span>');
  inp.value=''; inp.disabled=false;
  const fb=document.getElementById('q-feedback'); fb.className='feedback-box'; fb.innerHTML='';
  document.getElementById('btn-check').style.display='inline-flex';
  document.getElementById('btn-next').style.display='none';
  setTimeout(()=>inp.focus(),50);
}

function checkAns(){
  if(answered)return;
  const inp=document.getElementById('answer');
  const val=inp.value;
  if(!val.trim())return;
  answered=true; inp.disabled=true;
  const q=qList[qIdx], l=lang();
  const correct = norm(val)===norm(q.reponse);
  if(correct)score++;
  // Enregistre la progression (section conjugaison + le temps actuel)
  if(window.Progress) Progress.recordExercise('conjugaison', current.id, correct);
  const fb=document.getElementById('q-feedback'); fb.className='feedback-box show '+(correct?'correct':'wrong');
  let head;
  if(correct){ head=(l==='es'?'\u2705 \u00A1Correcto! \u2192 ':'\u2705 Correcte! \u2192 ')+'<strong>'+q.reponse+'</strong>'; }
  else { head=(l==='es'?'\u274C La respuesta correcta es: ':'\u274C La resposta correcta \u00E9s: ')+'<strong>'+q.reponse+'</strong>'; }
  fb.innerHTML=head+'<div class="explication">'+q.explication[l]+'</div>';
  document.getElementById('score').textContent=score;
  document.getElementById('total').textContent=qIdx+1;
  document.getElementById('btn-check').style.display='none';
  document.getElementById('btn-next').style.display='inline-flex';
  say(q.reponse);
  qIdx++;
}

function nextQ(){ renderQuestion(); }

function showCompletion(){
  const l=lang(), total=qList.length;
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('completion-area').style.display='block';
  document.getElementById('completion-area').innerHTML='<div class="card completion"><div class="completion-icon">\uD83C\uDF89</div><h2>'+(l==='es'?'\u00A1Bravo, Laura!':'Bravo, Laura!')+'</h2><p style="font-size:1.1rem;color:var(--gold);margin:0.5rem 0">'+score+' / '+total+'</p><button class="btn btn-primary" style="margin-top:1.5rem" onclick="showPractice()">\uD83D\uDD04 '+(l==='es'?'Repetir':'Repetir')+'</button></div>';
}

document.addEventListener('keydown',(e)=>{
  if(document.getElementById('practice-zone').style.display==='none')return;
  if(e.key==='Enter'){ if(!answered)checkAns(); else if(document.getElementById('btn-next').style.display!=='none')nextQ(); }
});

document.addEventListener('DOMContentLoaded',()=>{
  init();
  document.querySelectorAll('.lang-toggle button').forEach(b=>{
    b.addEventListener('click',()=>setTimeout(()=>{ buildSelect(); buildNiv(); document.getElementById('temps-select').value=index.temps.findIndex(t=>t.id===current.id); renderRegle(); if(document.getElementById('practice-zone').style.display!=='none')showPractice(); else showTables(); },0));
  });
});
</script>
</body>
