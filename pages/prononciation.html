<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/style.css">
<style>
.select-nav { width:100%; padding:0.8rem 1rem; background:var(--bg3); border:1px solid var(--border); border-radius:10px; color:var(--cream); font-family:'Outfit',sans-serif; font-size:1rem; font-weight:500; margin-bottom:1rem; }
.select-nav:focus { outline:none; border-color:var(--gold); }
.select-label { font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:0.4rem; display:block; }
.prevnext { display:flex; gap:0.5rem; margin-bottom:1.5rem; }
.prevnext .btn { flex:1; justify-content:center; }
.pron-row { display:grid; grid-template-columns:2.5rem 1fr; gap:0.75rem; align-items:start; padding:0.65rem 0; border-bottom:1px solid var(--border); }
.pron-row:last-child { border-bottom:none; }
.son-btn { width:2.2rem; height:2.2rem; border-radius:50%; border:1px solid var(--border); background:var(--bg3); color:var(--gold-light); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; transition:all 0.18s; flex-shrink:0; }
.son-btn:hover { background:var(--maple); color:white; border-color:var(--maple); transform:scale(1.05); }
.son-btn:active { transform:scale(0.92); }
.pron-mot { font-family:'Cormorant Garamond',serif; font-size:1.15rem; font-weight:600; color:var(--cream); }
.pron-ipa { font-family:'Outfit',sans-serif; font-size:0.82rem; color:var(--sky); margin-left:0.4rem; font-weight:400; }
.pron-trad { font-size:0.82rem; color:var(--text-dim); margin-top:0.1rem; line-height:1.4; }
.son-label { font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin:1.1rem 0 0.4rem; }
.son-label.nasal { color:var(--sage); }
.son-label.pas-nasal { color:var(--maple-light); }
.son-label.neutre { color:var(--gold); }
.ec-actions { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-top:0.4rem; }
</style>
</head>

  <div style="display:flex;align-items:center;">

<div class="nav-mobile">

  <a href="conjugaison.html"><span class="icon">✏️</span><span data-es="Verbos" data-ca="Verbs">Verbos</span></a>

<div class="page-wrap">
<div class="container">
  <div class="page-header fade-up">
    <div class="page-header-label">🔊 <span data-es="Módulo" data-ca="Mòdul">Módulo</span></div>
    <h1 data-es="Pronunciación" data-ca="Pronunciació">Pronunciación</h1>
    <p data-es="Los sonidos del francés que no existen en español. Elige un sonido y pulsa 🔊 para escucharlo." data-ca="Els sons del francès que no existeixen en castellà. Tria un so i prem 🔊 per escoltar-lo.">Los sonidos del francés. Elige un sonido y pulsa 🔊 para escucharlo.</p>
  </div>

  <label class="select-label" id="select-label" data-es="ELIGE UN SONIDO" data-ca="TRIA UN SO">ELIGE UN SONIDO</label>
  <select class="select-nav" id="son-select" onchange="goTo(this.value)"></select>
  <div class="prevnext">
    <button class="btn btn-ghost" onclick="step(-1)">← <span data-es="Anterior" data-ca="Anterior">Anterior</span></button>
    <button class="btn btn-ghost" onclick="step(1)"><span data-es="Siguiente" data-ca="Següent">Siguiente</span> →</button>
  </div>

  <div id="content"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/lang.js"></script>
<script>
let modules = [], modData = {}, flat = [], cur = 0, voicesCache = [];
const lang = () => localStorage.getItem('laura_lang') || 'es';

function loadVoices() { voicesCache = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text) {
  if (!('speechSynthesis' in window)) { alert(lang() === 'es' ? 'Tu navegador no soporta audio.' : 'El teu navegador no suporta àudio.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-CA';
  const v = voicesCache.find(x => x.lang === 'fr-CA') || voicesCache.find(x => x.lang && x.lang.startsWith('fr'));
  if (v) u.voice = v;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
function esc(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

async function load() {
  const r = await fetch('../data/prononciation/index.json');
  const idx = await r.json();
  modules = idx.modules;
  await Promise.all(modules.map(async m => {
    const res = await fetch('../' + m.fichier);
    modData[m.id] = await res.json();
  }));
  buildFlat();
  buildSelect();
  render(0);
}

function buildFlat() {
  flat = [];
  modules.forEach(m => {
    const d = modData[m.id];
    if (d.regles) {
      d.regles.forEach((r, i) => flat.push({ type: 'regle', modId: m.id, idx: i, group: m.titre }));
    } else if (d.exercices) {
      flat.push({ type: 'ecoute', modId: m.id, group: m.titre, ecouteTitle: m.titre });
    }
  });
}

function buildSelect() {
  const l = lang();
  const sel = document.getElementById('son-select');
  sel.innerHTML = '';
  let curGroupName = null, og = null;
  flat.forEach((f, i) => {
    const gName = f.group[l];
    if (gName !== curGroupName) {
      curGroupName = gName;
      og = document.createElement('optgroup');
      og.label = gName;
      sel.appendChild(og);
    }
    const o = document.createElement('option');
    o.value = i;
    if (f.type === 'regle') o.textContent = modData[f.modId].regles[f.idx].titre[l];
    else o.textContent = '👂 ' + f.ecouteTitle[l];
    if (i === cur) o.selected = true;
    og.appendChild(o);
  });
  document.getElementById('select-label').textContent = l === 'es' ? 'ELIGE UN SONIDO' : 'TRIA UN SO';
}

function goTo(i) { render(Number(i)); }
function step(d) { let n = cur + d; if (n < 0) n = flat.length - 1; if (n >= flat.length) n = 0; render(n); }

function render(i) {
  cur = i;
  document.getElementById('son-select').value = i;
  const f = flat[i];
  const l = lang();
  if (f.type === 'ecoute') {
    document.getElementById('content').innerHTML = renderEcoute(modData[f.modId], l);
  } else {
    document.getElementById('content').innerHTML = renderRegle(modData[f.modId].regles[f.idx], l);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exBlock(label, cls, arr, l) {
  if (!arr || !arr.length) return '';
  const rows = arr.map(e =>
    '<div class="pron-row">' +
      '<button class="son-btn" title="' + (l === 'es' ? 'Escuchar' : 'Escoltar') + '" onclick="say(\'' + esc(e.tts || e.mot) + '\')">🔊</button>' +
      '<div><div class="pron-mot">' + e.mot + (e.phonetique ? '<span class="pron-ipa">' + e.phonetique + '</span>' : '') + '</div>' +
      '<div class="pron-trad">' + e[l] + '</div></div>' +
    '</div>').join('');
  return '<div class="son-label ' + cls + '">' + label + '</div>' + rows;
}

function renderRegle(r, l) {
  const nasal = exBlock(l === 'es' ? '✅ CON sonido nasal' : '✅ AMB so nasal', 'nasal', r.exemples_nasal, l);
  const pas = exBlock(l === 'es' ? '❌ SIN sonido nasal' : '❌ SENSE so nasal', 'pas-nasal', r.exemples_pas_nasal, l);
  const plain = exBlock(l === 'es' ? '🔊 EJEMPLOS' : '🔊 EXEMPLES', 'neutre', r.exemples, l);
  return '<div class="card fade-up">' +
    '<div class="section-title">' + r.titre[l] + '</div>' +
    '<div class="info-box" style="margin-top:0.6rem">' + r.description[l] + '</div>' +
    nasal + pas + plain + '</div>';
}

function renderEcoute(d, l) {
  const intro = d.intro ? '<div class="info-box fade-up">' + d.intro[l] + '</div>' : '';
  window._ecoute = d;
  const cards = d.exercices.map((e, i) =>
    '<div class="card fade-up">' +
      '<div class="poem-meta" style="margin-bottom:0.6rem"><span class="tag tag-gold">' + e.niveau + '</span></div>' +
      '<div class="ec-actions">' +
        '<button class="btn btn-primary" onclick="say(\'' + esc(e.tts || e.texte) + '\')">🔊 ' + (l === 'es' ? 'Escuchar' : 'Escoltar') + '</button>' +
        '<button class="btn btn-ghost" onclick="reveal(' + i + ')">' + (l === 'es' ? '👁 Mostrar respuesta' : '👁 Mostrar resposta') + '</button>' +
      '</div>' +
      '<label class="reading-q-label">' + (l === 'es' ? 'Escribe lo que oíste:' : 'Escriu el que has sentit:') + '</label>' +
      '<input class="reading-input" type="text" placeholder="...">' +
      '<div id="rev-' + i + '" style="margin-top:0.6rem"></div>' +
    '</div>').join('');
  return intro + cards;
}

let revealedEcoute = new Set();
function reveal(i) {
  const e = window._ecoute.exercices[i];
  const l = lang();
  const note = e.note ? '<div class="explication">💡 ' + e.note[l] + '</div>' : '';
  document.getElementById('rev-' + i).innerHTML =
    '<div class="feedback-box show correct">🇫🇷 <strong>' + e.texte + '</strong>' +
    '<div class="explication">🇪🇸 ' + e[l] + '</div>' + note + '</div>';
  // Enregistre l'écoute comme "vue" (une fois par exercice)
  const key = (e.id || i);
  if (!revealedEcoute.has(key)) {
    revealedEcoute.add(key);
    if (window.Progress) Progress.recordExercise('prononciation', 'ecoute', true);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => setTimeout(() => { buildSelect(); render(cur); }, 0));
  });
});
</script>
</body>
</html>
