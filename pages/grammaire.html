<div class="page-wrap">
<div class="container">
  <div class="page-header fade-up">
    <div class="page-header-label">📐 <span data-es="Módulo 3" data-ca="Mòdul 3">Módulo 3</span></div>
    <h1 data-es="Gramática" data-ca="Gramàtica">Gramática</h1>
    <p data-es="Artículos, negación, adjetivos — con ejemplos del Quebec y comparaciones con el español." data-ca="Articles, negació, adjectius — amb exemples del Quebec i comparacions amb el castellà.">Artículos, negación, adjetivos — con ejemplos del Quebec y comparaciones con el español.</p>
  </div>

  <div class="tabs" id="mod-tabs"></div>
  <div id="mod-explication"></div>
  <hr class="divider">
  <div class="section-label" id="ex-label"></div>
  <div class="card fade-up" id="quiz-area">
    <div class="score-bar">
      <span class="score-pill">⭐ <span id="score">0</span> / <span id="total">0</span></span>
      <div class="progress-line"><div class="progress-line-fill" id="q-progress" style="width:0%"></div></div>
    </div>
    <div class="quiz-prompt" id="q-prompt"></div>
    <div class="options-grid" id="q-options"></div>
    <div class="feedback-box" id="q-feedback"></div>
    <div style="margin-top:1rem">
      <button class="btn btn-ghost" id="btn-next" style="display:none" onclick="nextQ()">
        <span data-es="Siguiente" data-ca="Següent">Siguiente</span> →
      </button>
    </div>
  </div>
  <div id="completion-area" style="display:none"></div>
</div>
</div>

<script src="../js/lang.js"></script>
<script>
let data = null, modIdx = 0, qIdx = 0, score = 0, answered = false;
const lang = () => localStorage.getItem('laura_lang') || 'es';

async function load() {
  const r = await fetch('../data/grammaire.json');
  data = await r.json();
  renderTabs(); startMod(0);
}

function renderTabs() {
  const l = lang();
  const el = document.getElementById('mod-tabs'); el.innerHTML = '';
  data.modules.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === modIdx ? ' active' : '');
    b.textContent = m.titre[l];
    b.onclick = () => startMod(i);
    el.appendChild(b);
  });
}

function startMod(i) {
  modIdx = i; qIdx = 0; score = 0; answered = false;
  document.getElementById('completion-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  renderTabs();
  const m = data.modules[i];
  const l = lang();
  document.getElementById('mod-explication').innerHTML = `
    <div class="info-box">${m.explication[l]}</div>`;
  document.getElementById('ex-label').textContent = l === 'es' ? 'EJERCICIOS' : 'EXERCICIS';
  renderQuestion();
}

function renderQuestion() {
  const m = data.modules[modIdx];
  const l = lang();
  answered = false;
  if (qIdx >= m.exercices.length) { showCompletion(); return; }
  const q = m.exercices[qIdx];
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = qIdx;
  document.getElementById('q-progress').style.width = (qIdx / m.exercices.length * 100) + '%';
  const phrase = q.phrase.replace(/_+/, '<span class="blank">___</span>');
  document.getElementById('q-prompt').innerHTML = phrase;
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box'; fb.innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  const opts = [...q.options].sort(() => Math.random() - 0.5);
  document.getElementById('q-options').innerHTML = opts.map(o =>
    `<button class="option" onclick="checkAns('${o.replace(/'/g,"\\'")}', this)">${o}</button>`
  ).join('');
}

function checkAns(sel, btn) {
  if (answered) return;
  answered = true;
  const q = data.modules[modIdx].exercices[qIdx];
  const l = lang();
  document.querySelectorAll('.option').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.reponse) b.classList.add('correct');
  });
  const correct = sel === q.reponse;
  if (correct) score++;
  btn.classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box show ' + (correct ? 'correct' : 'wrong');
  fb.innerHTML = (correct ? '✅ ' : '❌ ')
    + (correct
      ? (l === 'es' ? '¡Correcto!' : 'Correcte!')
      : (l === 'es' ? `Correcto: <strong>${q.reponse}</strong>` : `Correcte: <strong>${q.reponse}</strong>`))
    + `<div class="explication">${q.explication[l]}</div>`;
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = qIdx + 1;
  document.getElementById('btn-next').style.display = 'inline-flex';
  qIdx++;
}

function nextQ() { renderQuestion(); }

function showCompletion() {
  const l = lang();
  const total = data.modules[modIdx].exercices.length;
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('completion-area').style.display = 'block';
  document.getElementById('completion-area').innerHTML = `
    <div class="card completion">
      <div class="completion-icon">🌟</div>
      <h2>${l === 'es' ? '¡Excelente, Laura!' : 'Excel·lent, Laura!'}</h2>
      <p style="font-size:1.1rem;color:var(--gold);margin:0.5rem 0">${score} / ${total}</p>
      <button class="btn btn-primary" style="margin-top:1.5rem" onclick="startMod(${modIdx})">
        🔄 ${l === 'es' ? 'Repetir' : 'Repetir'}
      </button>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => setTimeout(() => { renderTabs(); }, 0));
  });
});
</script>
</body>
</html>
