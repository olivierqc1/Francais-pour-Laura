<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gramática — Français pour Laura</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.select-nav {
  width: 100%;
  padding: 0.8rem 1rem;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--cream);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem; font-weight: 500;
  margin-bottom: 1.5rem;
}
.select-nav:focus { outline: none; border-color: var(--gold); }
.select-label { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.4rem; display: block; }
</style>
</head>
<body>
<nav class="topbar">
  <a href="../index.html" class="topbar-logo">Français <span>pour Laura</span></a>
  <div style="display:flex;align-items:center;">
    <div class="topbar-nav">
      <a href="vocabulaire.html" data-es="Vocabulario" data-ca="Vocabulari">Vocabulario</a>
      <a href="conjugaison.html" data-es="Conjugación" data-ca="Conjugació">Conjugación</a>
      <a href="grammaire.html" class="active" data-es="Gramática" data-ca="Gramàtica">Gramática</a>
      <a href="prononciation.html" data-es="Pronunciación" data-ca="Pronunciació">Pronunciación</a>
      <a href="poemes.html" data-es="Poemas" data-ca="Poemes">Poemas</a>
      <a href="videos.html" data-es="Vídeos" data-ca="Vídeos">Vídeos</a>
    </div>
    <div class="lang-toggle"><button data-lang="es">ES</button><button data-lang="ca">CA</button></div>
  </div>
</nav>
<div class="nav-mobile">
  <a href="vocabulaire.html"><span class="icon">📚</span><span data-es="Vocab" data-ca="Vocab">Vocab</span></a>
  <a href="conjugaison.html"><span class="icon">✏️</span><span data-es="Verbos" data-ca="Verbs">Verbos</span></a>
  <a href="grammaire.html" class="active"><span class="icon">📐</span><span data-es="Gram." data-ca="Gram.">Gram.</span></a>
  <a href="prononciation.html"><span class="icon">🔊</span><span data-es="Pron." data-ca="Pron.">Pron.</span></a>
  <a href="poemes.html"><span class="icon">📜</span><span data-es="Poemas" data-ca="Poemes">Poemas</span></a>
  <a href="videos.html"><span class="icon">🎬</span><span data-es="Vídeos" data-ca="Vídeos">Vídeos</span></a>
</div>

<div class="page-wrap">
<div class="container">
  <div class="page-header fade-up">
    <div class="page-header-label">📐 <span data-es="Módulo 3" data-ca="Mòdul 3">Módulo 3</span></div>
    <h1 data-es="Gramática" data-ca="Gramàtica">Gramática</h1>
    <p data-es="Artículos, negación, adjetivos, pronombres — con ejemplos del Quebec y comparaciones con el español." data-ca="Articles, negació, adjectius, pronoms — amb exemples del Quebec i comparacions amb el castellà.">Artículos, negación, adjetivos, pronombres — con ejemplos del Quebec.</p>
  </div>

  <label class="select-label" id="select-label" data-es="ELIGE UN TEMA" data-ca="TRIA UN TEMA">ELIGE UN TEMA</label>
  <select class="select-nav" id="mod-select" onchange="startMod(this.value)"></select>

  <div id="mod-explication"></div>
  <hr class="divider">
  <div class="section-label" id="ex-label"></div>
  <div class="card fade-up" id="quiz-area">
    <div class="score-bar">
      <span class="score-pill">⭐ <span id="score">0</span> / <span id="total">0</span></span>
      <div class="progress-line"><div class="progress-line-fill" id="q-progress" style="width:0%"></div></div>
    </div>
    <div class="quiz-prompt" id="q-prompt"></div>
    <div class="options-grid" id="q-options"></div>
    <div class="feedback-box" id="q-feedback"></div>
    <div style="margin-top:1rem">
      <button class="btn btn-ghost" id="btn-next" style="display:none" onclick="nextQ()">
        <span data-es="Siguiente" data-ca="Següent">Siguiente</span> &rarr;
      </button>
    </div>
  </div>
  <div id="completion-area" style="display:none"></div>
</div>
</div>

<script src="../js/lang.js"></script>
<script>
let data = null, modIdx = 0, qIdx = 0, score = 0, answered = false;
const lang = () => localStorage.getItem('laura_lang') || 'es';

async function load() {
  const r = await fetch('../data/grammaire.json');
  data = await r.json();
  renderSelect();
  startMod(0);
}

function renderSelect() {
  const l = lang();
  const sel = document.getElementById('mod-select');
  sel.innerHTML = '';
  data.modules.forEach((m, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = m.titre[l];
    if (i === modIdx) o.selected = true;
    sel.appendChild(o);
  });
  document.getElementById('select-label').textContent = l === 'es' ? 'ELIGE UN TEMA' : 'TRIA UN TEMA';
}

function startMod(i) {
  modIdx = Number(i); qIdx = 0; score = 0; answered = false;
  document.getElementById('completion-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('mod-select').value = modIdx;
  const m = data.modules[modIdx];
  const l = lang();
  document.getElementById('mod-explication').innerHTML = '<div class="info-box">' + m.explication[l] + '</div>';
  document.getElementById('ex-label').textContent = l === 'es' ? 'EJERCICIOS' : 'EXERCICIS';
  renderQuestion();
}

function renderQuestion() {
  const m = data.modules[modIdx];
  const l = lang();
  answered = false;
  if (qIdx >= m.exercices.length) { showCompletion(); return; }
  const q = m.exercices[qIdx];
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = qIdx;
  document.getElementById('q-progress').style.width = (qIdx / m.exercices.length * 100) + '%';
  const phrase = q.phrase.replace(/_+/, '<span class="blank">___</span>');
  document.getElementById('q-prompt').innerHTML = phrase;
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box'; fb.innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  const opts = [...q.options].sort(() => Math.random() - 0.5);
  document.getElementById('q-options').innerHTML = opts.map(o =>
    '<button class="option" onclick="checkAns(\'' + o.replace(/'/g,"\\'") + '\', this)">' + o + '</button>'
  ).join('');
}

function checkAns(sel, btn) {
  if (answered) return;
  answered = true;
  const q = data.modules[modIdx].exercices[qIdx];
  const l = lang();
  document.querySelectorAll('.option').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.reponse) b.classList.add('correct');
  });
  const correct = sel === q.reponse;
  if (correct) score++;
  btn.classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box show ' + (correct ? 'correct' : 'wrong');
  fb.innerHTML = (correct ? '\u2705 ' : '\u274C ')
    + (correct
      ? (l === 'es' ? '\u00A1Correcto!' : 'Correcte!')
      : (l === 'es' ? 'Correcto: <strong>' + q.reponse + '</strong>' : 'Correcte: <strong>' + q.reponse + '</strong>'))
    + '<div class="explication">' + q.explication[l] + '</div>';
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = qIdx + 1;
  document.getElementById('btn-next').style.display = 'inline-flex';
  qIdx++;
}

function nextQ() { renderQuestion(); }

function showCompletion() {
  const l = lang();
  const total = data.modules[modIdx].exercices.length;
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('completion-area').style.display = 'block';
  document.getElementById('completion-area').innerHTML =
    '<div class="card completion">' +
      '<div class="completion-icon">\uD83C\uDF1F</div>' +
      '<h2>' + (l === 'es' ? '\u00A1Excelente, Laura!' : 'Excel\u00B7lent, Laura!') + '</h2>' +
      '<p style="font-size:1.1rem;color:var(--gold);margin:0.5rem 0">' + score + ' / ' + total + '</p>' +
      '<button class="btn btn-primary" style="margin-top:1.5rem" onclick="startMod(' + modIdx + ')">\uD83D\uDD04 ' + (l === 'es' ? 'Repetir' : 'Repetir') + '</button>' +
    '</div>';
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => setTimeout(() => { renderSelect(); startMod(modIdx); }, 0));
  });
});
</script>
</body>
</html>
