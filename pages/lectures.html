<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturas culturales — Français pour Laura</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.poem-nav { display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem; }
.poem-nav-btn {
  padding:0.5rem 1rem;border-radius:8px;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:500;
  border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);transition:all 0.2s;
  text-align:left;
}
.poem-nav-btn:hover { color:var(--cream);border-color:rgba(255,255,255,0.2); }
.poem-nav-btn.active { background:var(--maple);color:white;border-color:var(--maple); }
.poem-nav-btn .poem-nav-author { display:block;font-size:0.72rem;opacity:0.75;margin-top:0.1rem; }
.vocab-table { width:100%; border-collapse:collapse; }
.vocab-table td { padding:0.5rem 0.4rem;border-bottom:1px solid var(--border);font-size:0.88rem;vertical-align:top; }
.vocab-table td:first-child { font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--cream);width:40%; }
.questions-area { margin-top:0.5rem; }
.q-item { margin-bottom:1.2rem; }
.q-label { font-size:0.88rem;color:var(--cream-dim);margin-bottom:0.3rem;display:block; }
.q-piste { font-size:0.78rem;color:var(--text-dim);font-style:italic;margin-top:0.3rem; }
.topbar-account { font-size:1.35rem; text-decoration:none; margin-left:0.6rem; line-height:1; }
.mode-toggle { display:flex; gap:0.5rem; margin-bottom:1.2rem; flex-wrap:wrap; }
.mode-toggle .btn { flex:1; justify-content:center; }
</style>
</head>
<body>
<nav class="topbar">
  <a href="../index.html" class="topbar-logo">Français <span>pour Laura</span></a>
  <div style="display:flex;align-items:center;">
    <div class="topbar-nav">
      <a href="vocabulaire.html" data-es="Vocabulario" data-ca="Vocabulari">Vocabulario</a>
      <a href="conjugaison.html" data-es="Conjugación" data-ca="Conjugació">Conjugación</a>
      <a href="grammaire.html" data-es="Gramática" data-ca="Gramàtica">Gramática</a>
      <a href="prononciation.html" data-es="Pronunciación" data-ca="Pronunciació">Pronunciación</a>
      <a href="poemes.html" class="active" data-es="Poemas" data-ca="Poemes">Poemas</a>
      <a href="videos.html" data-es="Vídeos" data-ca="Vídeos">Vídeos</a>
    </div>
    <div class="lang-toggle"><button data-lang="es">ES</button><button data-lang="ca">CA</button></div>
    <a href="compte.html" class="topbar-account" title="Mi cuenta" aria-label="Mi cuenta">⭐</a>
  </div>
</nav>
<div class="nav-mobile">
  <a href="vocabulaire.html"><span class="icon">📚</span><span data-es="Vocab" data-ca="Vocab">Vocab</span></a>
  <a href="conjugaison.html"><span class="icon">✏️</span><span data-es="Verbos" data-ca="Verbs">Verbos</span></a>
  <a href="grammaire.html"><span class="icon">📐</span><span data-es="Gram." data-ca="Gram.">Gram.</span></a>
  <a href="prononciation.html"><span class="icon">🔊</span><span data-es="Pron." data-ca="Pron.">Pron.</span></a>
  <a href="poemes.html" class="active"><span class="icon">📜</span><span data-es="Poemas" data-ca="Poemes">Poemas</span></a>
  <a href="videos.html"><span class="icon">🎬</span><span data-es="Vídeos" data-ca="Vídeos">Vídeos</span></a>
</div>

<div class="page-wrap">
<div class="container">
  <div class="page-header fade-up">
    <div class="page-header-label">🌍 <span data-es="Mundo francófono" data-ca="Món francòfon">Mundo francófono</span></div>
    <h1 data-es="Lecturas culturales" data-ca="Lectures culturals">Lecturas culturales</h1>
    <p data-es="Textos cortos sobre países francófonos: Bélgica, Senegal, Suiza, Haití y más. Lee, comprende, descubre." data-ca="Textos curts sobre països francòfons: Bèlgica, Senegal, Suïssa, Haití i més. Llegeix, comprèn, descobreix.">Textos cortos sobre países francófonos: Bélgica, Senegal, Suiza, Haití y más.</p>
  </div>

  <div class="mode-toggle">
    <a class="btn btn-ghost" href="poemes.html">📜 <span data-es="Poemas" data-ca="Poemes">Poemas</span></a>
    <a class="btn btn-gold" href="lectures.html">🌍 <span data-es="Lecturas" data-ca="Lectures">Lecturas</span></a>
  </div>

  <div class="poem-nav" id="poem-nav"></div>
  <div id="poem-content"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/lang.js"></script>
<script>
let data = null, pIdx = 0;
const lang = () => localStorage.getItem('laura_lang') || 'es';

async function load() {
  const r = await fetch('../data/lectures.json');
  data = await r.json();
  renderNav(); renderPoem(0);
}

function renderNav() {
  const el = document.getElementById('poem-nav');
  el.innerHTML = '';
  data.poemes.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'poem-nav-btn' + (i === pIdx ? ' active' : '');
    b.innerHTML = `${p.titre}<span class="poem-nav-author">${p.auteur} · ${p.pays}</span>`;
    b.onclick = () => { pIdx = i; renderNav(); renderPoem(i); };
    el.appendChild(b);
  });
}

function renderPoem(i) {
  const p = data.poemes[i];
  const l = lang();
  const tagPays = p.pays.includes('Québec') ? 'tag-maple' : 'tag-sky';

  const stanzas = p.texte.map(s => `<div class="poem-stanza">${s}</div>`).join('');

  const vocabRows = p.mots_cles.map(m => `
    <tr>
      <td>${m.mot}</td>
      <td style="color:var(--text-dim)">${m[l]}</td>
    </tr>`).join('');

  const questions = p.questions.map((q, qi) => `
    <div class="q-item">
      <label class="q-label">${qi + 1}. ${q.q[l]}</label>
      <input class="reading-input" type="text" placeholder="${q.piste[l]}">
    </div>`).join('');

  const noteHtml = p.note ? `<div class="warning-box">${p.note[l]}</div>` : '';

  document.getElementById('poem-content').innerHTML = `
    <div class="fade-up">
      <!-- HEADER -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="poem-meta">
          <span class="tag ${tagPays}">${p.pays}</span>
          <span class="tag tag-gold">${p.annee}</span>
          <span class="tag tag-sky">${p.auteur}</span>
        </div>
        <h2 style="font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--cream);margin-bottom:1rem;">${p.titre}</h2>
        <div class="info-box">${p.bio[l]}</div>
      </div>

      <!-- POEM TEXT -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="section-label" style="margin-bottom:0.75rem">${l === 'es' ? 'TEXTO' : 'TEXT'}</div>
        ${stanzas}
      </div>

      ${noteHtml ? `<div style="margin-bottom:1rem">${noteHtml}</div>` : ''}

      <!-- VOCABULARY -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="section-label" style="margin-bottom:0.75rem">${l === 'es' ? 'VOCABULARIO CLAVE' : 'VOCABULARI CLAU'}</div>
        <table class="vocab-table">
          <thead>
            <tr>
              <td style="color:var(--maple);font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;padding-bottom:0.6rem">
                ${l === 'es' ? 'Palabra francesa' : 'Paraula francesa'}
              </td>
              <td style="color:var(--maple);font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;padding-bottom:0.6rem">
                ${l === 'es' ? 'Traducción' : 'Traducció'}
              </td>
            </tr>
          </thead>
          <tbody>${vocabRows}</tbody>
        </table>
      </div>

      <!-- ANALYSIS -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="section-label" style="margin-bottom:0.75rem">${l === 'es' ? 'ANÁLISIS' : 'ANÀLISI'}</div>
        <div style="font-size:0.92rem;color:var(--text);line-height:1.8">${p.analyse[l]}</div>
      </div>

      <!-- QUESTIONS -->
      <div class="card">
        <div class="section-label" style="margin-bottom:0.75rem">${l === 'es' ? 'PREGUNTAS DE COMPRENSIÓN' : 'PREGUNTES DE COMPRENSIÓ'}</div>
        <div class="questions-area">${questions}</div>
        <button class="btn btn-primary" style="margin-top:1rem" onclick="checkQuestions(this)">
          ${l === 'es' ? '✓ Verificar' : '✓ Verificar'}
        </button>
        <div id="q-result" style="margin-top:0.75rem"></div>
      </div>
    </div>`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let answeredPoems = new Set();
function checkQuestions(btn) {
  const inputs = btn.closest('.card').querySelectorAll('input');
  const l = lang();
  let hasAny = false;
  inputs.forEach(i => { if (i.value.trim()) hasAny = true; });
  if (!hasAny) {
    document.getElementById('q-result').innerHTML = `<div class="warning-box">${l === 'es' ? '⚠️ Escribe algo primero.' : '⚠️ Escriu alguna cosa primer.'}</div>`;
    return;
  }
  document.getElementById('q-result').innerHTML = `<div class="info-box">✅ ${l === 'es' ? '¡Bien hecho! Tus respuestas han sido registradas. Sigue leyendo y practicando.' : 'Ben fet! Les teves respostes han estat registrades. Segueix llegint i practicant.'}</div>`;
  btn.textContent = l === 'es' ? '✅ Verificado' : '✅ Verificat';
  btn.disabled = true;
  // Enregistre le poème comme complété (une fois par poème)
  const pid = data.poemes[pIdx].id;
  if (!answeredPoems.has(pid)) {
    answeredPoems.add(pid);
    if (window.Progress) Progress.recordExercise('poemes', pid, true);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => setTimeout(() => { renderNav(); renderPoem(pIdx); }, 0));
  });
});
</script>
</body>
</html>
